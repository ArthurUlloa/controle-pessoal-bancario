<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <h1>FinControl</h1>
            <p>Controle Financeiro Pessoal</p>
        </div>
    </header>

    <main class="container">

        <!-- RESUMO -->
        <section class="resumo">

            <div class="card saldo">
                <span>Saldo atual</span>
                <h2 id="saldo">R$ 0,00</h2>
            </div>

            <div class="card">
                <span>Receitas</span>
                <h2 id="receitas">R$ 0,00</h2>
            </div>

            <div class="card">
                <span>Despesas</span>
                <h2 id="despesas">R$ 0,00</h2>
            </div>

        </section>


        <!-- FORMULÁRIO -->
        <section class="form-section">

            <h2>Adicionar transação</h2>

            <form id="formTransacao">

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input 
                        type="text"
                        id="descricao"
                        placeholder="Ex: Mercado"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="valor">Valor</label>
                    <input 
                        type="number"
                        id="valor"
                        placeholder="Ex: 100"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="categoria">Categoria</label>

                    <select id="categoria">

                        <option value="Alimentação">
                            Alimentação
                        </option>

                        <option value="Transporte">
                            Transporte
                        </option>

                        <option value="Casa">
                            Casa
                        </option>

                        <option value="Lazer">
                            Lazer
                        </option>

                        <option value="Salário">
                            Salário
                        </option>

                        <option value="Outros">
                            Outros
                        </option>

                    </select>
                </div>


                <div class="campo">
                    <label for="tipo">Tipo</label>

                    <select id="tipo">

                        <option value="receita">
                            Receita
                        </option>

                        <option value="despesa">
                            Despesa
                        </option>

                    </select>
                </div>


                <button type="submit">
                    Adicionar
                </button>

            </form>

        </section>


        <!-- TRANSAÇÕES -->
        <section class="transacoes">

            <div class="titulo-transacoes">

                <h2>Últimas transações</h2>

                <select id="filtro">

                    <option value="todos">
                        Todas
                    </option>

                    <option value="receita">
                        Receitas
                    </option>

                    <option value="despesa">
                        Despesas
                    </option>

                </select>

            </div>


            <div id="listaTransacoes">

                <p class="vazio">
                    Nenhuma transação cadastrada.
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>X
